name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and static-analysis tools
        run: |
          python -m pip install .
          python -m pip install "mypy>=1.13,<2" "ruff>=0.9,<1"
      - name: Check source and tests
        run: |
          ruff check src tests scripts
          python -m mypy src/authgraph
          python -m compileall -q src tests scripts

  unit:
    name: Unit (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: py311-minimum-dependencies
            os: ubuntu-latest
            python: "3.11"
            minimum_dependencies: true
          - name: py312
            os: ubuntu-latest
            python: "3.12"
            minimum_dependencies: false
          - name: py313
            os: ubuntu-latest
            python: "3.13"
            minimum_dependencies: false
          - name: py314
            os: ubuntu-latest
            python: "3.14"
            minimum_dependencies: false
          - name: windows-py314
            os: windows-latest
            python: "3.14"
            minimum_dependencies: false
          - name: macos-py314
            os: macos-latest
            python: "3.14"
            minimum_dependencies: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install minimum dependencies
        if: matrix.minimum_dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography==44.0.0" "neo4j==6.2.0"
          python -m pip install --no-deps .
      - name: Install current dependencies
        if: matrix.minimum_dependencies == false
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -X dev -m unittest discover -s tests -v

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/authgraph-wheel-smoke"
          "$RUNNER_TEMP/authgraph-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/authgraph-wheel-smoke/bin/python" -m pip install dist/*.whl
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/authgraph-wheel-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/ci/installed-wheel-smoke.py" \
            --source-root "$GITHUB_WORKSPACE"
      - name: Upload checked distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authgraph-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependency audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.7,<3"
      - name: Audit resolved project dependencies
        run: python -m pip_audit --strict --progress-spinner off .
